<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colmans Online Ordering and Trade System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800;1,900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f2;--card:#fff;--ink:#0b0b0b;--mute:#5c5c5c;--line:#dcdcdc;--pu:#e8163f;--pu-ink:#fff;--soft:#ebebeb;--dk:#0b0b0b;--ok:#1f7a4d;--warn:#946512;--bad:#c4122f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050505;--card:#121212;--ink:#fff;--mute:#a1a1a1;--line:#272727;--soft:#1a1a1a;--dk:#000;--ok:#4cc38a;--warn:#e8b04a;--bad:#ff6b81;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050505;--card:#121212;--ink:#fff;--mute:#a1a1a1;--line:#272727;--soft:#1a1a1a;--dk:#000;--ok:#4cc38a;--warn:#e8b04a;--bad:#ff6b81;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,.brand b,.big2,.giant,.lb b{font-family:Archivo,Impact,'Arial Black',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
h1{font-size:34px;line-height:1;margin:0 0 14px}h2{font-size:22px;margin:30px 0 14px}
h2::after,.ph h1::after{content:"";display:block;width:36px;height:3px;background:var(--pu);margin-top:8px}
.top{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--mute);padding:7px 24px;border-bottom:1px solid var(--line)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 24px}
.brand b{font-size:26px}.brand b::after{content:"";display:inline-block;width:8px;height:8px;background:var(--pu);border-radius:50%;margin-left:3px}
nav{flex:1;display:flex;justify-content:center;gap:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink);font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-current]{border-color:var(--pu)}
.who{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.tgl{background:none;border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.cartpill{border:1.5px solid var(--pu);background:none;color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:24px 20px 40px}
input,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
:focus-visible{outline:2px solid var(--pu);outline-offset:2px}
.btn{background:var(--pu);color:var(--pu-ink);border:0;border-radius:99px;padding:10px 22px;font:inherit;font-weight:700;cursor:pointer}.btn.sm{padding:7px 14px;font-size:13px}
.btn:disabled,.add:disabled{opacity:.4;cursor:not-allowed}.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.wide{width:100%}
.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--pu);color:#fff;font:inherit;font-weight:700;font-size:20px;line-height:1;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,currentColor 14%,transparent)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
small{color:var(--mute);display:block;font-size:12px}.mute{color:var(--mute)}s{color:var(--mute);font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.grow{flex:1}
.tile{position:relative;background:var(--soft);overflow:hidden}.tile img{width:100%;height:100%;object-fit:contain;padding:14px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.tile img.m{object-fit:cover;object-position:top center;padding:0;filter:none}.tile img.alt{position:absolute;inset:0;opacity:0;transition:opacity .3s}.prod:hover .alt{opacity:1}
.hero{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#d9d9d9,#bcbcbc);border-radius:26px;height:clamp(520px,60vw,660px);margin-bottom:30px;color:#fff}
.hero::before{content:"";position:absolute;left:-14%;top:-20%;width:80%;height:95%;background:#5b5b5b;border-radius:0 0 60% 0/0 0 85% 0;z-index:-1}
.hero .t1{position:absolute;top:2%;left:0;right:0;text-align:center;font-size:clamp(50px,13.5vw,178px);line-height:1;margin:0;z-index:1;text-shadow:0 6px 28px rgba(0,0,0,.25)}.hero .t1::after{display:none}
.t2{position:absolute;top:calc(2% + clamp(50px,13.5vw,178px));left:0;right:0;text-align:center;letter-spacing:.5em;text-indent:.5em;font-weight:300;font-size:clamp(14px,2.4vw,30px);z-index:1;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.hero .cta{position:absolute;left:50%;top:calc(2% + clamp(50px,13.5vw,178px) + clamp(44px,5.5vw,76px));transform:translateX(-50%);z-index:3;white-space:nowrap}
.mdl{position:absolute;left:6%;bottom:0;height:86%;width:auto;z-index:2;filter:drop-shadow(0 20px 24px rgba(0,0,0,.35))}
.blurb{position:absolute;left:34%;bottom:7%;width:min(250px,28%);font-size:12px;color:#2b2b2b;z-index:3}.blurb b{font-size:14px}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--pu);cursor:pointer;margin-top:6px}
.cards{position:absolute;right:4%;bottom:6%;display:flex;gap:12px;z-index:3}
.cards .c{width:clamp(80px,12vw,130px);aspect-ratio:3/4;border-radius:18px;border:3px solid transparent;overflow:hidden;padding:0;background:#222;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.3)}.cards .c[aria-pressed=true]{border-color:var(--pu)}.cards img{width:100%;height:100%;object-fit:cover;object-position:top}
.giantwrap{position:relative;margin:30px 0 80px}.giant{font-size:clamp(120px,28vw,360px);line-height:.8;color:var(--ink);letter-spacing:-.04em}
.dcards{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(620px,66%);margin:calc(-1*clamp(40px,8vw,110px)) 0 0 auto}
.dc{background:#fff;color:#0b0b0b;border-radius:16px;padding:10px;display:grid;gap:8px}.dc .tile{aspect-ratio:3/4;border-radius:10px;background:#eee}.dc b{font-size:13px}.dc small{color:#555}
.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}.sec h2{margin:0}
.sec.c{position:relative;flex-direction:column;justify-content:center;text-align:center;margin-bottom:22px}.sec.c h2::after{margin:8px auto 0}
.tag{position:absolute;right:0;top:0;background:#fff;color:#0b0b0b;font-size:12px;font-weight:700;padding:6px 14px;border-radius:99px}
.col3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}
.cc{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 50% 38%,#4a4a4a,#111);text-align:left}
.cc img{width:100%;height:100%;object-fit:contain;padding:14%}.cc.m img{object-fit:cover;object-position:top;padding:0}
.cc::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.lb{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:8px;z-index:1}.lb b{font-size:22px}
.pill2{background:var(--pu);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.srch{width:min(300px,100%);padding:10px 16px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin:14px 0 40px}
.prod{position:relative;display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;margin:0;border-radius:0}.prod b{font-size:14px}
.prod .tile{aspect-ratio:4/5;border-radius:18px;display:grid;place-items:center;font-size:64px;margin-bottom:8px}.prod .row{margin-top:4px}
.off{position:absolute;top:10px;left:10px;z-index:2;background:var(--pu);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.chips [aria-pressed=true]{background:var(--pu);color:#fff;border-color:var(--pu)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:45}body.co .scrim{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--card);transform:translateX(100%);transition:.25s;z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:-10px 0 30px rgba(0,0,0,.3)}body.co .drawer{transform:none}
.drawer h2{margin:0}.x{background:none;border:0;font-size:18px;color:var(--ink);cursor:pointer}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mini{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px}.mini img{padding:4px}.mini img.m{padding:0}.sm2{width:32px;height:32px;font-size:16px;border-radius:9px}
.qty{display:flex;align-items:center;gap:8px;white-space:nowrap}.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tot{padding:12px 0;font-size:17px}
.ph{margin-bottom:18px}.ph h1{margin:0 0 2px}.ph p{margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}.stats .card{margin:0}
.stat{display:flex;align-items:center;gap:12px}.stat b{font:900 22px Archivo,sans-serif;display:block}
.ic{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:20px;padding:12px;min-height:160px;display:flex;flex-direction:column;gap:10px;align-content:start}.col .card{margin:0}.col .row>b{font-size:14px}
.oc{display:grid;gap:8px}.thumbs2{display:flex;gap:8px;flex-wrap:wrap}.tp{position:relative}.tp em{position:absolute;right:-4px;bottom:-4px;background:var(--pu);color:#fff;font:700 10px/1 sans-serif;padding:3px 6px;border-radius:99px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}.cardgrid .card{margin:0;display:grid;gap:10px;align-content:start}
.av{width:44px;height:44px;border-radius:50%;background:var(--pu);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv b{font-size:18px}
.ic2{display:grid;gap:6px;margin:0}.ic2 .tile{height:130px;border-radius:14px;display:grid;place-items:center;font-size:48px}.big2{font-size:28px}
.bar{height:6px;border-radius:9px;background:var(--line)}.bar i{display:block;height:100%;border-radius:9px;background:currentColor}
.adjb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.adjb button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px;cursor:pointer;font:inherit;font-weight:700}
.hb{display:grid;grid-template-columns:130px 1fr 110px;align-items:center;gap:12px;font-size:13px;margin:10px 0}.hb b{text-align:right}
.fi{display:flex;align-items:center;gap:12px;margin-bottom:10px}.fi .r{display:grid;gap:4px;justify-items:end}
.steps{display:flex;margin:14px 0}.steps div{flex:1;text-align:center;font-size:12px;color:var(--mute);position:relative}
.steps i{display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1}
.steps div::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}.steps div:first-child::before{display:none}
.steps .on{color:var(--ink);font-weight:700}.steps .on i,.steps .on::before{background:var(--pu)}
.empty{text-align:center;padding:36px;display:grid;gap:10px;justify-items:center;font-size:40px}.empty p{font-size:15px;margin:0}
.note{background:var(--soft);padding:10px 14px;border-radius:12px}
.frm{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.frm label{display:grid;gap:4px;font-size:13px;color:var(--mute);flex:1 1 150px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:var(--pu);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;z-index:70;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{background:#000;color:#e9e9e9;margin-top:30px;padding:36px 24px 22px;border-top:1px solid var(--line)}
.fw{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}.fw p{margin:8px 0;font-size:13px;color:#a1a1a1;max-width:300px}
footer h3{font-size:14px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--pu);display:inline-block}
.fl{display:block;background:none;border:0;color:#a1a1a1;font:inherit;font-size:13px;padding:3px 0;cursor:pointer;text-align:left}.fl:hover{color:#fff}
.cp{max-width:1180px;margin:22px auto 0;font-size:12px;color:#7a7a7a}footer .brand b{color:#fff}
@media (max-width:800px){.hero{height:600px}.blurb{display:none}.mdl{left:-2%;height:72%}.cards .c{width:78px}.col3{grid-template-columns:1fr}.cc{aspect-ratio:4/3}.dcards{width:100%;margin-top:-30px}.fw{grid-template-columns:1fr 1fr}.top span:nth-child(2){display:none}nav{order:3;flex-basis:100%;justify-content:flex-start}header{padding:10px 14px}.hb{grid-template-columns:90px 1fr 90px}.tag{position:static;margin-top:8px}}
@media (prefers-reduced-motion:reduce){#toast,.drawer,.scrim,.alt{transition:none}}
</style>
</head>

const av=n=>`<span class="av">${esc(n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`,

th=o=>o.items.map(i=>`<span class="tp"><span class="tile mini">${prod(i.p)?pic(prod(i.p)):'📦'}</span><em>${i.q}</em></span>`).join(''),

oc=o=>`<div class="card oc"><div class="row"><b>${o.id}</b><small>${fmt(o.ts)}</small></div><div>${esc(o.party)}</div><div class="thumbs2">${th(o)}</div><div class="row"><b>${peso(tot(o))}</b>${NX[o.status]?`<span><button class="btn sm" onclick="setSt('${o.id}','${FL[FL.indexOf(o.status)+1]}')">${NX[o.status]}</button> <button class="x" title="Cancel order" aria-label="Cancel ${o.id}" onclick="setSt('${o.id}','Cancelled')">✕</button></span>`:''}</div></div>`,

heroH=()=>{const L=HL(),p=L[hi]||L[0];return `<h1 class="t1">STREETWEAR</h1><div class="t2">NEW DROP</div><button class="btn cta" onclick="chg('${p.id}',1);toast('Added to cart')">Add to cart · ${peso(p.price)}</button><img class="mdl" src="${IMG[p.img]}" alt="${esc(p.name)}"><div class="blurb"><b>${esc(p.name)}</b><br>Heavyweight fits made for the street. Order online and we will have it ready for you.<br><button class="lnk" onclick="nav('shop')">Shop all →</button></div><div class="cards">${L.map((x,i)=>`<button class="c" aria-pressed="${i===hi}" aria-label="Show ${esc(x.name)}" onclick="setHi(${i})"><img src="${IMG[x.img]}" alt=""></button>`).join('')}</div>`},
setHi=i=>{hi=i;$('#hero').innerHTML=heroH()};
const HL=()=>['h1f','t2f','h3f'].map(k=>S.products.find(p=>p.img===k)).filter(Boolean),N=['All','Deals',...CF.slice(1)],
tm=()=>{const d=document.documentElement,n=d.dataset.theme==='light'?'dark':'light';d.dataset.theme=n;try{localStorage.setItem('cm-theme',n)}catch(e){}},

footH=cu=>``;
try{document.documentElement.dataset.theme=localStorage.getItem('cm-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}
const adj=(id,n)=>{const p=prod(id);p.stock=Math.max(0,p.stock+n);done(`${p.name}: ${p.stock} in stock.`)},
addProd=d=>{S.products.push({id:'p'+Date.now(),e:ci(d.cat)[1],was:0,name:d.name,cat:d.cat,price:+d.price,stock:+d.stock,min:+d.min});done('Product added.')},
addSup=d=>{S.suppliers.push({id:'s'+Date.now(),...d});done('Supplier added.')},
addPO=d=>{S.purchases.unshift({id:nid('PO'),s:d.s,p:d.p,q:+d.q,cost:+d.cost,status:'Ordered',ts:Date.now()});done('Purchase order recorded.')},
recv=id=>{const o=S.purchases.find(p=>p.id===id);o.status='Received';prod(o.p).stock+=o.q;done(`${id} received. Stock updated.`)},
cancelPO=id=>{S.purchases.find(p=>p.id===id).status='Cancelled';done(`${id} cancelled.`)},
addTrade=d=>{const p=prod(d.p),n=+d.q;if(n>p.stock)return toast(`Only ${p.stock} of ${p.name} in stock. Lower the quantity.`);p.stock-=n;
S.orders.unshift({id:nid('TRD'),type:'trade',party:d.b,items:[{p:d.p,q:n,pr:Math.round(p.price*(100-d.d))/100}],status:'Pending',ts:Date.now()});done('Wholesale order recorded.')},
addUser=d=>{S.users.push({id:'u'+Date.now(),name:d.name,role:d.role});done('User added.')},
setRole=(id,r)=>{S.users.find(u=>u.id===id).role=r;done('Role updated.')};
const V={
home:()=>{const L=HL(),mn=n=>Math.min(...S.products.filter(p=>p.cat===n).map(p=>p.price));return `<section class="hero" id="hero">${heroH()}</section>
<div class="giantwrap"><div class="giant" aria-hidden="true">DROP</div><div class="dcards">${L.map(p=>`<div class="dc"><div class="tile"><img class="m" src="${IMG[p.img2]}" alt=""></div><div class="row"><div><b>${esc(p.name)}</b><small>${peso(p.price)}</small></div><button class="add" aria-label="Add ${esc(p.name)} to cart" onclick="chg('${p.id}',1);toast('Added to cart')">+</button></div></div>`).join('')}</div></div>
<div class="sec c"><h2>Collections</h2><span class="tag">Curated ✦</span></div>
<div class="col3">${[['Clothing','h3b',1],['Footwear','sneak',0],['Bags','bpk',0]].map(([n,k,m])=>`<button class="cc${m?' m':''}" onclick="gocat('${n}')"><img src="${IMG[k]}" alt=""><span class="lb"><b>${n}</b><span class="pill2">From ${peso(mn(n))}</span></span></button>`).join('')}</div>`},
shop:()=>{const TT={All:'All products',Deals:'Deals'};return `<div class="ph"><h1>${TT[cf]||esc(cf)}</h1><p class="mute">${list().length} items</p></div><div class="sec"><div class="chips">${N.map((n,i)=>`<button aria-pressed="${cf===n}" onclick="cf=N[${i}];go()">${n}</button>`).join('')}</div><input class="srch" aria-label="Search products" placeholder="Search products" value="${esc(q)}" oninput="q=this.value;$('#grid').innerHTML=grid()"></div><div id="grid" class="grid">${grid()}</div>`},
mine:()=>{const o=S.orders.filter(o=>o.type==='retail'&&o.party===me().name);return ph(['My orders','Follow each order from placed to completed.'])+(o.map(o=>`<div class="card"><div class="row"><div><b>${o.id}</b><small>${fmt(o.ts)}</small></div><b>${peso(tot(o))}</b></div><div class="thumbs2">${th(o)}</div>${o.status==='Cancelled'?'<p><span class="pill bad">Cancelled</span></p>':`<div class="steps">${FL.map((s,i)=>`<div class="${i<=FL.indexOf(o.status)?'on':''}"><i></i>${s}</div>`).join('')}</div>`}${o.status==='Pending'?`<button class="btn ghost sm" onclick="setSt('${o.id}','Cancelled')">Cancel order</button>`:''}</div>`).join('')||'<div class="card empty">🛍️<p>You have no orders yet.</p><button class="btn" onclick="nav(\'shop\')">Start shopping</button></div>')},
orders:()=>ph(['Orders','Move each customer order along as you prepare it.'])+`<div class="stats">${st2('🕒','Pending orders',S.orders.filter(o=>o.type==='retail'&&o.status==='Pending').length)}${st2('📦','Items to restock',S.products.filter(p=>p.stock<=p.min).length)}${st2('🚚','Open purchases',S.purchases.filter(p=>p.status==='Ordered').length)}${st2('💰','Sales so far',peso(S.orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+tot(o),0)))}</div>`+board('retail'),
inventory:()=>{const l=S.products.filter(p=>inv==='all'||(inv==='low'?p.stock>0&&p.stock<=p.min:p.stock===0));return ph(['Inventory','Watch your stock and restock before items run out.'])+`<div class="chips">${[['all','All'],['low','Low stock'],['out','Out of stock']].map(([k,t])=>`<button aria-pressed="${inv===k}" onclick="inv='${k}';go()">${t}</button>`).join('')}</div><div class="grid">${l.map(p=>{const[t,c]=stk(p);return `<div class="card ic2"><div class="tile">${pic(p)}</div><b>${esc(p.name)}</b><small>${esc(p.cat)} · ${peso(p.price)}</small><div class="row"><span class="big2">${p.stock}</span><span class="pill ${c}">${t}</span></div><div class="bar ${c}"><i style="width:${Math.min(100,Math.round(p.stock/(p.min*3)*100))}%"></i></div><small>Reorder at ${p.min}</small><div class="adjb">${[-10,-1,1,10].map(n=>`<button aria-label="Change stock by ${n}" onclick="adj('${p.id}',${n})">${n>0?'+':'−'}${Math.abs(n)}</button>`).join('')}</div>${p.stock<=p.min?`<button class="btn sm" onclick="pre='${p.id}';nav('purchasing')">Reorder</button>`:''}</div>`}).join('')||'<p class="mute">Nothing in this view.</p>'}</div><h2>Add a product</h2>`+F('addProd',[['name','Product name'],['cat','Category','select',opt(CAT,x=>[x[0],x[0]])],['price','Price (₱)','number'],['stock','Opening stock','number'],['min','Reorder level','number']],'Add product')},
suppliers:()=>ph(['Suppliers','Your partners, what you bought from them and who to call.'])+`<div class="cardgrid">${S.suppliers.map(s=>{const l=S.purchases.filter(p=>p.s===s.id&&p.status!=='Cancelled');return `<div class="card"><div class="row">${av(s.name)}<div class="grow"><b>${esc(s.name)}</b><small>${esc(s.contact)} · ${esc(s.phone)}</small></div></div><div class="kv"><div><small>Purchases</small><b>${l.length}</b></div><div><small>Total spent</small><b>${peso(l.reduce((a,p)=>a+p.q*p.cost,0))}</b></div></div><div class="thumbs2">${l.slice(0,4).map(p=>`<span class="tile mini">${prod(p.p)?pic(prod(p.p)):'📦'}</span>`).join('')||'<small>No purchases yet</small>'}</div><button class="btn ghost sm" onclick="pres='${s.id}';nav('purchasing')">New purchase</button></div>`}).join('')}</div><h2>Add a supplier</h2>`+F('addSup',[['name','Supplier name'],['contact','Contact person'],['phone','Phone']],'Add supplier'),
purchasing:()=>{const low=S.products.filter(p=>p.stock<=p.min);return ph(['Purchasing','Order stock from suppliers and receive it when it arrives.'])+(low.length?`<h2>Needs restocking</h2><div class="chips">${low.map(p=>`<button onclick="pre='${p.id}';go()"><span class="tile mini sm2">${pic(p)}</span>${esc(p.name)} <b class="warn">${p.stock}</b></button>`).join('')}</div>`:'')+'<h2>New purchase order</h2>'+F('addPO',[['s','Supplier','select',opt(S.suppliers,s=>[s.id,s.name],pres)],['p','Product','select',opt(S.products,p=>[p.id,p.name],pre)],['q','Quantity','number','min="1"'],['cost','Unit cost (₱)','number']],'Record purchase order')+'<h2>Purchase orders</h2><div class="cardgrid">'+(S.purchases.map(p=>`<div class="card"><div class="row"><div class="row"><span class="tile mini">${prod(p.p)?pic(prod(p.p)):'📦'}</span><div><b>${esc(pname(p.p))}</b><small>${p.id} · ${fmt(p.ts)}</small></div></div><span class="pill ${C[p.status]}">${p.status}</span></div><small>${esc(sname(p.s))}</small><div class="row"><span>${p.q} × ${peso(p.cost)}</span><b>${peso(p.q*p.cost)}</b></div>${p.status==='Ordered'?`<div class="row"><button class="btn sm" onclick="recv('${p.id}')">Mark received</button><button class="btn ghost sm" onclick="cancelPO('${p.id}')">Cancel</button></div>`:''}</div>`).join('')||'<p class="mute">No purchase orders yet.</p>')+'</div>'},
trade:()=>{const t=S.orders.filter(o=>o.type==='trade'&&o.status!=='Cancelled');return ph(['Trade and wholesale','Sell in bulk to other businesses at a wholesale price.'])+`<div class="stats">${st2('🏪','Wholesale orders',t.length)}${st2('💰','Wholesale sales',peso(t.reduce((a,o)=>a+tot(o),0)))}</div>`+F('addTrade',[['b','Business name'],['p','Product','select',opt(S.products,p=>[p.id,`${p.name} (${p.stock} in stock)`])],['q','Quantity','number','min="1"'],['d','Wholesale discount (%)','number','value="10" max="90"']],'Record wholesale order')+board('trade')},
records:()=>{const r=[...S.orders.map(o=>({ts:o.ts,ref:o.id,t:o.type==='trade'?'Wholesale sale':'Customer sale',who:o.party,amt:tot(o),st:o.status})),...S.purchases.map(p=>({ts:p.ts,ref:p.id,t:'Supplier purchase',who:sname(p.s),amt:-p.q*p.cost,st:p.status}))].sort((a,b)=>b.ts-a.ts),v=r.filter(x=>x.st!=='Cancelled'),sum=f=>v.filter(f).reduce((a,x)=>a+Math.abs(x.amt),0),a1=sum(x=>x.t==='Customer sale'),a2=sum(x=>x.t==='Wholesale sale'),a3=sum(x=>x.amt<0),mx=Math.max(a1,a2,a3,1),hb=(l,n,c)=>`<div class="hb"><span>${l}</span><div class="bar ${c}"><i style="width:${n/mx*100}%"></i></div><b>${peso(n)}</b></div>`;
return ph(['Transaction records','Every sale and purchase in one place.'])+`<div class="stats">${st2('📈','Money in',peso(a1+a2))}${st2('📉','Money out',peso(a3))}${st2('⚖️','Net',peso(a1+a2-a3))}</div><div class="card">${hb('Customer sales',a1,'ok')}${hb('Wholesale',a2,'warn')}${hb('Supplier purchases',a3,'bad')}</div><h2>Activity</h2>${r.map(x=>`<div class="card fi"><span class="ic">${x.amt<0?'🚚':x.t==='Wholesale sale'?'🏪':'🛍️'}</span><div class="grow"><b>${x.t}</b><small>${esc(x.who)} · ${x.ref} · ${fmt(x.ts)}</small></div><div class="r"><b class="${x.amt<0?'bad':''}">${x.amt<0?'−':'+'}${peso(Math.abs(x.amt))}</b><span class="pill ${C[x.st]}">${x.st}</span></div></div>`).join('')}`},
users:()=>ph(['Users','Control who can shop, manage stock or run the system.'])+`<div class="cardgrid">${S.users.map(u=>`<div class="card"><div class="row">${av(u.name)}<div class="grow"><b>${esc(u.name)}</b><small>${{customer:'Can shop and track orders',staff:'Manages orders, stock and purchasing',admin:'Full access, including users'}[u.role]}</small></div></div><select aria-label="Role of ${esc(u.name)}" onchange="setRole('${u.id}',this.value)">${opt(['customer','staff','admin'],r=>[r,r],u.role)}</select></div>`).join('')}</div><h2>Add a user</h2>`+F('addUser',[['name','Full name'],['role','Role','select',opt(['customer','staff','admin'],r=>[r,r])]],'Add user')};
const NAV={customer:[['home','Home'],['shop','Shop'],['mine','My orders']],staff:[['orders','Orders'],['inventory','Inventory'],['suppliers','Suppliers'],['purchasing','Purchasing'],['trade','Trade'],['records','Records']]};
NAV.admin=[...NAV.staff,['users','Users']];
const nav=k=>{view=k;go();scrollTo(0,0)};
function go(){const u=me(),n=NAV[u.role];if(!n.some(x=>x[0]===view))view=n[0][0];tg(0);const cu=u.role==='customer',sh=cu&&(view==='home'||view==='shop');
$('#app').innerHTML=`${sh?'<div class="top"><span>Pickup · Delivery · Deals</span><span>New drops every week</span><span>IG · FB · TikTok</span></div>':''}<header><div class="brand"><b>COLMANS</b></div><nav>${n.map(([k,l])=>`<button ${k===view?'aria-current="page"':''} onclick="nav('${k}')">${l}</button>`).join('')}</nav><label class="who">Signed in as<select aria-label="Switch user" onchange="S.me=this.value;cart={};save();go()">${opt(S.users,x=>[x.id,`${x.name} (${x.role})`],S.me)}</select></label><button class="tgl" aria-label="Toggle light and dark theme" onclick="tm()">◐</button>${sh?`<button class="cartpill" onclick="tg(1)">Cart <span id="cc">${cn()} items</span></button>`:''}</header><main>${V[view]()}</main>${cu?`<div class="scrim" onclick="tg(0)"></div><aside class="drawer" id="cart">${cartH()}</aside>`:''}${footH(cu)}`;pre=pres=''}
go();
</script>
